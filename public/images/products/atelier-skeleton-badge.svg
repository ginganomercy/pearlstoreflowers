<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFBF9" />
      <stop offset="50%" stop-color="#F4EFE8" />
      <stop offset="100%" stop-color="#EAE3D9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183324" />
      <stop offset="100%" stop-color="#2D5A3F" />
    </linearGradient>
    <radialGradient id="glowGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183324" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="400" cy="450" r="320" fill="url(#glowGlow)" />

  <!-- Outer Double Luxury Border -->
  <rect x="36" y="36" width="728" height="928" rx="28" fill="none" stroke="#D1C7B7" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="48" y="48" width="704" height="904" rx="20" fill="none" stroke="#183324" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Corner Flourishes -->
  <g fill="none" stroke="#AA771C" stroke-width="2">
    <!-- Top-Left -->
    <path d="M 64 96 C 64 74, 74 64, 96 64" />
    <circle cx="64" cy="64" r="3" fill="#AA771C" />
    <!-- Top-Right -->
    <path d="M 736 96 C 736 74, 726 64, 704 64" />
    <circle cx="736" cy="64" r="3" fill="#AA771C" />
    <!-- Bottom-Left -->
    <path d="M 64 904 C 64 926, 74 936, 96 936" />
    <circle cx="64" cy="936" r="3" fill="#AA771C" />
    <!-- Bottom-Right -->
    <path d="M 736 904 C 736 926, 726 936, 704 936" />
    <circle cx="736" cy="936" r="3" fill="#AA771C" />
  </g>

  <!-- Top Studio Ribbon Pill -->
  <g transform="translate(400, 160)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="#183324" filter="url(#softShadow)" />
    <text text-anchor="middle" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#F3E5AB" letter-spacing="3">✦ ARSIP RESMI ATELIER ✦</text>
  </g>

  <!-- Central Seal Emblem -->
  <g transform="translate(400, 420)" filter="url(#softShadow)">
    <!-- Outer Gold Ring -->
    <circle cx="0" cy="0" r="140" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="#D1C7B7" stroke-width="1.5" stroke-dasharray="4 3" />
    <!-- Inner Botanical Emblem Background -->
    <circle cx="0" cy="0" r="112" fill="url(#emeraldGrad)" />

    <!-- Botanical Floral Silhouette -->
    <g fill="#F3E5AB">
      <!-- Crown / Petals -->
      <path d="M 0 -60 C 15 -35, 35 -20, 50 0 C 30 10, 15 35, 0 60 C -15 35, -30 10, -50 0 C -35 -20, -15 -35, 0 -60 Z" opacity="0.9" />
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="8" fill="#AA771C" />
      <!-- Star Flares -->
      <polygon points="0,-80 5,-65 20,-65 8,-55 12,-40 0,-50 -12,-40 -8,-55 -20,-65 -5,-65" fill="url(#goldGrad)" />
      <polygon points="0,80 5,65 20,65 8,55 12,40 0,50 -12,40 -8,55 -20,65 -5,65" fill="url(#goldGrad)" transform="rotate(180)" />
    </g>
  </g>

  <!-- Typography Suite -->
  <text x="400" y="630" text-anchor="middle" font-family="'Playfair Display', serif" font-size="36" font-weight="700" fill="#183324" letter-spacing="1">Pearl Store Flowers</text>
  
  <text x="400" y="670" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#8C6738" letter-spacing="4">PORTOFOLIO FOTO DALAM KURASI</text>

  <!-- Divider Line with Diamond -->
  <g transform="translate(400, 710)" stroke="#AA771C" stroke-width="1.5">
    <line x1="-120" y1="0" x2="-20" y2="0" />
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#AA771C" stroke="none" />
    <line x1="20" y1="0" x2="120" y2="0" />
  </g>

  <!-- Description / Assurance -->
  <text x="400" y="755" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#57534E">
    Rangkaian Autentik Atelier Slawi, Tegal &amp; Brebes
  </text>
  <text x="400" y="785" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#183324" opacity="0.85">
    Kuntum Segar • Kartu Segel Lilin • Siap Dipesan Langsung
  </text>

  <!-- Bottom Wax Stamp Hallmark Motif -->
  <g transform="translate(400, 870)">
    <circle cx="0" cy="0" r="32" fill="#FAF5E8" stroke="#D4AF37" stroke-width="2" />
    <text text-anchor="middle" y="6" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#AA771C">PSF</text>
  </g>
</svg>

